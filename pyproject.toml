# Python tooling config. No Python package yet; this applies to any .py files
# added to the repo (e.g. data pipeline work). Install with `npm run setup:py`.

[project]
name = "damocles"
version = "0.0.0"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["node_modules", "dist", "data/raw", "public/data"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, RUF ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "single"
