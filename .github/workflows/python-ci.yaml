name: Python CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - pyproject.toml
      - 'requirements*.txt'
      - .github/workflows/python-ci.yaml
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - pyproject.toml
      - 'requirements*.txt'
      - .github/workflows/python-ci.yaml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: npm run setup:py
      - run: npm run check-format:py
      - run: npm run lint:py
