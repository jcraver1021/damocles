# The methodology: what "aligned" means per issue. Changes affect every
# score; bump `version`. Compiled to public/data/rubric.json by ingest.
#
# categories[].aggregate: mean (default) | min (weakest issue counts).
# issues[]:
#   anchors: refs with the direction that counts as aligned.
#     vote:<congress>-<house|senate>-<roll>   Voteview roll call
#     bill:<type><number>-<congress>          sponsors/cosponsors; for "yes"
#       bills, non-signers in that chamber get weak "not aligned" evidence
#       (skipped under 10 signers)
#     alignedPosition: yes (Yea/signing is aligned) | no. weight: default 1.
#     Count each vote under one issue only. Run `npm run verify:anchors`.
#   scorecards: key, name, url, polarity (aligned | inverted), file (CSV;
#     format in data/scorecards/README.md; no file = listed, not scored).
#   kindWeights, minEvidenceWeight: per-issue scoring overrides.
#   nonCosponsorEvidence: false = no "didn't sign on" evidence.

version: 7
updated: '2026-11-05'

