# Citizen campaigns. Ingest resolves audiences and writes campaigns.json.
#
# audience.session: current | incoming (non-departing members + members-elect).
#   Membership is by caucus, so caucusing independents count.
# threshold.kind:
#   block-floor-majority: audience - floor(chamberSize/2) committed members
#   caucus-majority: majority of the audience
# threshold.partialAt: default half of what's needed.
# positions[].stance: committed | leaning | undecided (default) | opposed
#   (backs the target). Strict rule: "committed" needs an explicit "won't vote
#   for them"; calls for new leadership, conditional pledges, and outlets'
#   characterizations are "leaning". Use the latest statement.
#   quoteVerified: set by `npm run verify:quotes -- --write`.
# milestones[].status: pending | met | missed. outcome: open | success |
#   partial | failure.

campaigns:
  - id: no-jeffries-speaker
    title: House Democrats, don't vote for Jeffries as Speaker
    ask: Publicly commit not to vote for Hakeem Jeffries for Speaker of the House.
    goal: >-
      Hakeem Jeffries is not elected Speaker of the House in the 120th Congress.
    audience:
      chamber: house
      caucus: Democrat
      session: incoming
      description: The incoming House Democratic Caucus (120th Congress)
    threshold:
      kind: block-floor-majority
      chamberSize: 435
    successCriteria: Jeffries is not elected Speaker.
    partialCriteria: >-
      Jeffries is elected, but only after more than one ballot, or after the partial threshold of members publicly withheld support.
    failureCriteria: Jeffries is elected Speaker on the first ballot.
    outcome: open
    notes: >-
      The Speaker is elected by public roll call on the House floor when the new Congress convenes, so the final vote can be checked against commitments. Delegates don't vote for Speaker; the threshold counts voting members only.
    milestones:
      - id: caucus-settled
        title: Incoming caucus settled
        description: All House races called, so the audience is final.
        status: pending
      - id: first-commitment
        title: First member publicly commits
        status: pending
      - id: caucus-nomination
        title: Jeffries not chosen as the caucus nominee for Speaker
        description: House Democrats choose their Speaker nominee in caucus leadership elections. Bloomberg Government reports Nov. 18–19 and Punchbowl reports Nov. 18; Fox News reports mid-December. Jeffries announced his candidacy on Nov. 4, and no challenger has declared.
        status: pending
        date: 2026-11-18
        sourceUrl: https://news.bgov.com/bloomberg-government-news/house-democratic-leadership-elections-set-for-nov-18-and-19
      - id: partial-threshold
        title: Partial threshold of public commitments reached
        status: pending
      - id: blocking-threshold
        title: Enough public commitments to block a first-ballot win
        status: pending
      - id: floor-vote
        title: Jeffries not elected Speaker on the floor
        date: '2027-01-03'
        status: pending
        sourceUrl: https://www.wsiu.org/politics-elections/2026-11-04/hakeem-jeffries-is-poised-to-become-the-first-black-speaker-of-the-house
