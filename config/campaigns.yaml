  - id: no-schumer-leader
    title: Senate Democrats, don't vote for Schumer as Majority Leader
    ask: >-
      Publicly commit not to vote for Chuck Schumer as Senate Democratic leader.
    goal: >-
      Chuck Schumer is not chosen as Senate Majority Leader in the 120th Congress.
    audience:
      chamber: senate
      caucus: Democrat
      session: incoming
      description: The incoming Senate Democratic Caucus (120th Congress), including independents who caucus with it
    threshold:
      kind: caucus-majority
    successCriteria: Schumer is not elected Democratic leader.
    partialCriteria: >-
      Schumer is elected, but faces a challenger who forces a contested vote, or the partial threshold of senators publicly withheld support.
    failureCriteria: Schumer is elected leader without a contested vote.
    outcome: open
    notes: >-
      Senate Democrats choose their leader in a caucus election, usually by secret ballot, so progress can only be tracked through public statements, not the final vote.
    milestones:
      - id: caucus-settled
        title: Incoming caucus settled
        description: All Senate races called, so the audience is final.
        status: pending
      - id: first-commitment
        title: First senator publicly commits
        status: met
        date: 2026-03-18
        description: Juliana Stratton, then a Senate candidate in Illinois, said she would not support Schumer as leader.
        sourceUrl: https://www.mediaite.com/politics/dick-durbins-likely-senate-replacement-explains-why-she-wont-support-schumer-as-leader/
      - id: challenger
        title: A challenger declares for leader
        status: pending
        description: As of Nov. 4, no senator has declared a challenge. Politico reports Adam Schiff is interested in a leadership bid; Chris Van Hollen says a run "has just not been my focus."
        sourceUrl: https://www.foxnews.com/politics/chuck-schumer-sweeping-democratic-midterm-victories-reelected-majority-leader
      - id: partial-threshold
        title: Partial threshold of public commitments reached
        status: pending
      - id: majority-committed
        title: A majority of the caucus publicly committed
        status: pending
      - id: leadership-election
        title: Schumer not elected Democratic leader
        status: pending
        description: Expected in early December, by secret ballot, with senators-elect voting; Schumer needs a simple majority. Schumer has said he is running.
        sourceUrl: https://rollcall.com/2026/11/04/will-be-reelected-as-majority-leader-schumer-says/
    positions:
